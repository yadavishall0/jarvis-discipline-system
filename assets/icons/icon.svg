<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#05070d" />
    </radialGradient>
    <linearGradient id="arcGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#00ff9d" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGlow)" />
  
  <!-- Outer Tactical Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#00e5ff" stroke-width="3" stroke-opacity="0.25" />
  <circle cx="256" cy="256" r="195" fill="none" stroke="#00e5ff" stroke-width="1.5" stroke-dasharray="10 8" stroke-opacity="0.4" />
  
  <!-- Arc HUD brackets -->
  <path d="M 256 65 A 191 191 0 0 1 447 256" fill="none" stroke="url(#arcGlow)" stroke-width="6" stroke-linecap="round" filter="url(#glow)" />
  <path d="M 65 256 A 191 191 0 0 1 256 447" fill="none" stroke="url(#arcGlow)" stroke-width="6" stroke-linecap="round" filter="url(#glow)" />
  
  <!-- Inner Status Ring -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="#1e293b" stroke-width="16" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="#00e5ff" stroke-width="16" stroke-dasharray="660" stroke-dashoffset="180" stroke-linecap="round" filter="url(#glow)" />
  
  <!-- Central Reactor Core -->
  <polygon points="256,160 339,208 339,304 256,352 173,304 173,208" fill="#0c1424" stroke="#00e5ff" stroke-width="4" filter="url(#glow)" />
  <polygon points="256,185 317,220 317,292 256,327 195,292 195,220" fill="none" stroke="#00ff9d" stroke-width="2" stroke-opacity="0.8" />
  
  <!-- Core J Symbol -->
  <text x="256" y="278" font-family="'Courier New', monospace" font-size="76" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">J</text>
  
  <!-- Crosshairs -->
  <line x1="256" y1="40" x2="256" y2="70" stroke="#00e5ff" stroke-width="3" />
  <line x1="256" y1="442" x2="256" y2="472" stroke="#00e5ff" stroke-width="3" />
  <line x1="40" y1="256" x2="70" y2="256" stroke="#00e5ff" stroke-width="3" />
  <line x1="442" y1="256" x2="472" y2="256" stroke="#00e5ff" stroke-width="3" />
</svg>
